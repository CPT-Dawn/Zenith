# ╔══════════════════════════════════════════════════════════════════════╗
# ║                      Zenith - Default Config                         ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# This file is written to:
#   ~/.config/zenith/config.toml
#
# Matching stylesheet:
#   ~/.config/zenith/style.css
#
# -----------------------------------------------------------------------
# Quick Start
# -----------------------------------------------------------------------
# 1) Edit values below.
# 2) Save.
# 3) Restart Zenith (or your session if needed) to apply changes.
#
# Notes:
# - Pixel values are integers.
# - Colors are CSS strings (for example: rgba(26, 27, 38, 0.95)).
# - Keep quotes around strings.
# - This config produces a slim, flush top bar (28px) anchored to
#   the screen edges with no gaps.  Increase height to 32-36 if
#   you prefer a more spacious look.
#

[bar]
# -----------------------------------------------------------------------
# Display Target
# -----------------------------------------------------------------------
# Monitor connector name. Leave commented out to use the default monitor.
# Examples: "eDP-1", "DP-1", "HDMI-A-1", "HDMI-1"
# monitor = "eDP-1"

# -----------------------------------------------------------------------
# Geometry
# -----------------------------------------------------------------------
# Overall bar height in pixels.
# 28px is minimal-but-legible at 1080p.  Bump to 32 on HiDPI if needed.
height = 28

# Horizontal gap from left/right screen edges (0 = flush).
gap_horizontal = 0

# Gap from the top edge of the monitor (0 = flush).
gap_top = 0

# Corner radius for the outer shell (0 = sharp rectangle).
border_radius = 0

# Animated border thickness (0 = no visible border).
border_width = 0

# -----------------------------------------------------------------------
# Visual Motion
# -----------------------------------------------------------------------
# Seconds for one full animated border cycle.
# Only visible when border_width > 0.
rgb_cycle_seconds = 12.0

# -----------------------------------------------------------------------
# Surface Color
# -----------------------------------------------------------------------
# Main bar body background.
# Tokyo Night Storm base with 95 % opacity for subtle compositor blur.
background = "rgba(26, 27, 38, 0.95)"


[modules]
# -----------------------------------------------------------------------
# Module Toggles
# -----------------------------------------------------------------------
# Set any item to false to disable that module.
clock = true
system_stats = true
playerctl = true
todo = true

# Clock format (strftime syntax).
# Examples:
#   "%H:%M"
#   "%H:%M:%S"
#   "%a %d %b  %H:%M"
clock_format = "%a %H:%M"
