# ╔══════════════════════════════════════════════════════════════════════╗
# ║                      Zenith - Default Config                         ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# This file is written to:
#   ~/.config/zenith/config.toml
#
# Matching stylesheet:
#   ~/.config/zenith/style.css
#
# -----------------------------------------------------------------------
# Quick Start
# -----------------------------------------------------------------------
# 1) Edit values below.
# 2) Save.
# 3) Restart Zenith (or your session if needed) to apply changes.
#
# Notes:
# - Pixel values are integers.
# - Colors are CSS strings (for example: rgba(20, 24, 30, 0.78)).
# - Keep quotes around strings.
# - Bar height/gaps are tuned for typical 1080p panels (~48px tall bar).
#   On higher resolutions or scaling, increase height/gaps slightly if it feels tight.
#

[bar]
# -----------------------------------------------------------------------
# Display Target
# -----------------------------------------------------------------------
# Monitor connector name. Leave commented out to use the default monitor.
# Examples: "eDP-1", "DP-1", "HDMI-A-1", "HDMI-1"
monitor = "eDP-1"

# -----------------------------------------------------------------------
# Geometry
# -----------------------------------------------------------------------
# Overall bar height in pixels (GTK + layer-shell; must fit module fonts in Default_Style.css).
height = 48

# Horizontal gap from left/right screen edges.
gap_horizontal = 12

# Gap from the top edge of the monitor.
gap_top = 8

# Corner radius used by the outer/inner shell.
border_radius = 12

# Border thickness in pixels.
border_width = 1

# -----------------------------------------------------------------------
# Visual Motion
# -----------------------------------------------------------------------
# Seconds for one full animated border cycle.
# Kept for compatibility with older themes; the default styles ship with
# restrained (nearly-static) visuals rather than an aggressive spectrum border.
rgb_cycle_seconds = 24.0

# -----------------------------------------------------------------------
# Surface Color
# -----------------------------------------------------------------------
# Main bar body background.
# Use a semi-transparent value for a glass look on Wayland compositors.
background = "rgba(26, 27, 38, 0.78)"


[modules]
# -----------------------------------------------------------------------
# Module Toggles
# -----------------------------------------------------------------------
# Set any item to false to disable that module.
clock = true
system_stats = true
playerctl = true
todo = true

# Clock format (strftime syntax).
# Current default keeps the bar clean and low-motion for first-time users.
# Examples:
#   "%H:%M"
#   "%H:%M:%S"
#   "%a %d %b  %H:%M"
clock_format = "%H:%M"
