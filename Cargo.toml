[package]
name = "zenith-bar"
version = "2.2.0"
edition = "2024"
rust-version = "1.92"
authors = ["CPT-Dawn"]
description = "The lightest beautiful status bar for Wayland"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CPT-Dawn/Zenith"
keywords = ["wayland", "statusbar", "hyprland", "gtk4", "layer-shell"]
categories = ["gui"]

# The benchmark harness (`bench/`) is a standalone crate with its own workspace.
[workspace]
exclude = ["bench"]

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_22"] }
gtk4-layer-shell = { version = "0.8.1", features = ["v1_3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
toml = "1.1.8"
toml_edit = "0.25.17"
jiff = "0.2.38"
strsim = "0.11.1"
log = "0.4.34"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
# Only to enable async File::move_future (todo saves); use it through the gtk4::gio re-export.
gio = { version = "0.22.2", features = ["v2_72"] }

[build-dependencies]
glib-build-tools = "0.22.8"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
