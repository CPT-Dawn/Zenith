[package]
name = "zenith-bar"
version = "2.3.0"
edition = "2024"
rust-version = "1.97"
authors = ["CPT-Dawn"]
description = "The lightest beautiful status bar for Wayland"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CPT-Dawn/Zenith"
keywords = ["wayland", "statusbar", "hyprland", "gtk4", "layer-shell"]
categories = ["gui"]

# The benchmark harness (`bench/`) is a standalone crate with its own workspace.
[workspace]
exclude = ["bench"]

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_22"] }
gtk4-layer-shell = { version = "0.8.1", features = ["v1_3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
toml = "1.1.8"
toml_edit = "0.25.17"
jiff = "0.2.38"
strsim = "0.11.1"
log = "0.4.34"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
# Only to enable async File::move_future (todo saves); use it through the gtk4::gio re-export.
gio = { version = "0.22.2", features = ["v2_72"] }
# The clipboard module's types and framing (the Hoarder socket API v1). Only the types:
# its blocking client would stall the main loop (ADR-0002), so the module drives the
# socket with gio itself.
# Hoarder ships hoarder-ipc by git only (never crates.io), pinned to a release tag.
hoarder-ipc = { git = "https://github.com/CPT-Dawn/Hoarder", tag = "v1.0.0" }
# Bindings to libgio's Unix half (already linked): passing a pipe to the Daemon for
# thumbnails and reading it back without blocking.
gio-unix = "0.22.8"

[build-dependencies]
glib-build-tools = "0.22.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
# The fake Hoarder Daemon in tests/source_clipboard.rs receives fds over SCM_RIGHTS.
rustix = { version = "1.1", features = ["net"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
