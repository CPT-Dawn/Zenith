name: Benchmark

# Seam 3: every preset runs under headless Sway, must stay within its
# Performance budget (bench/budget.toml), and must start, hot-reload, follow
# output hotplug and pick up a config written after a first run (--smoke).
# See docs/performance.md for the method and the numbers behind the budgets.

on:
  push:
    paths:
      - "bench/**"
      - "src/**"
      - "resources/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    # Arch, because v2 needs GTK >= 4.22 and Arch is the primary distro.
    container: archlinux:latest
    steps:
      - name: Install toolchain, Sway and GTK
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust sway dbus mesa gtk4 gtk4-layer-shell \
            ttf-dejavu
          # Arch ships sway with cap_sys_nice, which a container can't grant,
          # so exec fails with EPERM. Headless benchmarking doesn't need it.
          setcap -r /usr/bin/sway

      - name: Checkout
        uses: actions/checkout@v4

      - name: Harness unit tests
        run: cargo test --manifest-path bench/Cargo.toml

      - name: Build Zenith (release)
        run: cargo build --release --locked

      - name: Benchmark and smoke-test every preset under headless Sway
        shell: bash
        run: |
          set -uo pipefail
          status=0
          echo '### Benchmark (GitHub runner, Sway pixman, default renderer)' >> "$GITHUB_STEP_SUMMARY"
          for preset in bloom minimal classic; do
            echo "::group::$preset"
            cargo bench-bar --bin target/release/zenith-bar --preset "$preset" \
              --renderer pixman --require-compositor --smoke \
              --budget bench/budget.toml 2>&1 | tee "bench-$preset.txt"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            if (( code != 0 )); then
              echo "::error title=Benchmark ($preset)::exit $code, see the log above"
              status=1
            fi
            { echo '```'; cat "bench-$preset.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
