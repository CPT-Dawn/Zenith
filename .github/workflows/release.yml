name: Release

# Pushing a vX.Y.Z tag publishes a GitHub Release with git-cliff notes and a
# prebuilt x86_64 tarball, then updates the zenith-bar and zenith-bar-bin AUR
# packages. Pre-release tags (vX.Y.Z-rc.1) get a GitHub pre-release with the
# tarball and leave the AUR alone. Run it by hand with dry_run to preview the
# notes, tarball, PKGBUILDs and .SRCINFOs as artifacts without publishing.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (example: v2.0.0)"
        required: true
      dry_run:
        description: "Only build the notes and AUR files; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    outputs:
      stable: ${{ steps.kind.outputs.stable }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git git-cliff github-cli

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Classify the tag
        id: kind
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi

      - name: Check the version matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$cargo_version" != "$TAG" ]]; then
            echo "Tag $TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Render notes with git-cliff
        run: |
          git-cliff --current --strip header -o release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

      - name: Publish GitHub Release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "Zenith ${TAG#v}" --notes-file release-notes.md)
          [[ "${{ steps.kind.outputs.stable }}" == "true" ]] || args+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Zenith ${TAG#v}" --notes-file release-notes.md
          else
            gh release create "$TAG" "${args[@]}"
          fi

  binary:
    name: Release binary
    needs: notes
    runs-on: ubuntu-latest
    # Built on Arch so it links against the same glibc/GTK that
    # zenith-bar-bin users have.
    container: archlinux:latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust gtk4 gtk4-layer-shell github-cli

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          got="$(target/release/zenith-bar --version)"
          echo "$got"
          [[ "$got" == "zenith-bar ${TAG#v}" ]]

      - name: Pack the tarball
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          .github/scripts/package_binary.sh --version "${TAG#v}" \
            --binary target/release/zenith-bar --out dist
          cat dist/*.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: dist/

      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  aur:
    name: AUR package (${{ matrix.package }})
    needs: [notes, binary]
    if: needs.notes.outputs.stable == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      # One package failing shouldn't hold the other back.
      fail-fast: false
      matrix:
        package: [zenith-bar, zenith-bar-bin]
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh namcap
          # makepkg refuses to run as root.
          useradd --create-home builder

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Configure SSH for the AUR
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "Secret AUR_SSH_PRIVATE_KEY is not set." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Accept the key as-is or base64-encoded.
          if grep -q "BEGIN .*PRIVATE KEY" <<<"$AUR_SSH_PRIVATE_KEY"; then
            printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/aur
          else
            printf '%s' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r\n' | base64 -d > ~/.ssh/aur
          fi
          chmod 600 ~/.ssh/aur
          ssh-keygen -y -f ~/.ssh/aur >/dev/null
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          # Container jobs set HOME=/github/home, but ssh ignores $HOME and
          # reads ~ from passwd (/root), so spell every path out.
          cat > ~/.ssh/config <<EOF
          Host aur.archlinux.org
            User aur
            IdentityFile $HOME/.ssh/aur
            UserKnownHostsFile $HOME/.ssh/known_hosts
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          echo "GIT_SSH_COMMAND=ssh -F $HOME/.ssh/config" >> "$GITHUB_ENV"

      - name: Clone the AUR repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            mkdir aur-repo
          else
            # Cloning a package that doesn't exist yet gives an empty repo,
            # and the first push creates it.
            git clone "ssh://aur@aur.archlinux.org/${{ matrix.package }}.git" aur-repo
          fi
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Download the release tarball
        if: matrix.package == 'zenith-bar-bin'
        uses: actions/download-artifact@v4
        with:
          name: release-binary
          path: dist

      - name: Generate PKGBUILD and .SRCINFO
        working-directory: aur-repo
        shell: bash
        run: |
          set -euo pipefail
          args=(--tag "$TAG" --package "${{ matrix.package }}")
          # Checksum the exact file the binary job attached to the release.
          if [[ "${{ matrix.package }}" == "zenith-bar-bin" ]]; then
            chown -R builder: ../dist
            args+=(--tarball "../dist/zenith-bar-${TAG#v}-x86_64.tar.gz")
          fi
          runuser -u builder -- bash ../.github/scripts/generate_aur_files.sh "${args[@]}"
          namcap PKGBUILD
          cat PKGBUILD >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AUR files
        uses: actions/upload-artifact@v4
        with:
          name: aur-files-${{ matrix.package }}
          path: |
            aur-repo/PKGBUILD
            aur-repo/zenith-bar.install
            aur-repo/.SRCINFO
          include-hidden-files: true

      - name: Push to the AUR
        if: env.DRY_RUN != 'true'
        shell: bash
        working-directory: aur-repo
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD zenith-bar.install .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already up to date."
            exit 0
          fi
          git commit -m "${{ matrix.package }}: update to ${TAG#v}"
          git push origin master
